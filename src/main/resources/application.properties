spring.application.name=kuznia

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kuznia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kuznia}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kuznia}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${SERVER_PORT:8080}
