services:
  postgres:
    image: postgres:16-alpine
    container_name: kuznia-postgres
    environment:
      POSTGRES_DB: kuznia
      POSTGRES_USER: kuznia
      POSTGRES_PASSWORD: kuznia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuznia -d kuznia"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
